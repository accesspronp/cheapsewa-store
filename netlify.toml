[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  # lets the server read the built-in product list to double-check prices at checkout
  included_files = ["public/products-data.js"]

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
